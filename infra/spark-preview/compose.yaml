# Local Spark Thrift Server + shared Hive Metastore for the Spark/Hive preview
# acceptance (docs/runbook.md "Spark / Hive shared Metastore preview").
#
# Throwaway fixture services, not part of the platform: they stand in for the
# "existing" Spark Thrift Server and Hive Metastore that a real deployment
# already runs. Both containers share one warehouse volume so a table created
# on the Hive side and a table created through Spark point at the same files.
# Both run as root only because they share that docker volume (the hive image
# runs as uid 1000, the spark image as uid 185); never do this outside a
# throwaway fixture.
#
#   docker compose -f infra/spark-preview/compose.yaml up -d
#
# The platform reaches them over the `ainative-backend` network, so both host
# names must be in AIND_SOURCE_HOST_ALLOWLIST.
name: ${SPARK_PREVIEW_PROJECT:-ainative-spark-preview}

services:
  hive-metastore:
    image: apache/hive:3.1.3
    user: root
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: derby
      # The derby schema is created by datanucleus on first start (see
      # metastore-hive-site.xml), so the entrypoint's schematool step is skipped.
      IS_RESUME: "true"
      HIVE_CUSTOM_CONF_DIR: /opt/hive/custom-conf
    volumes:
      - warehouse:/opt/hive/data
      - ./metastore-hive-site.xml:/opt/hive/custom-conf/hive-site.xml:ro
    ports:
      - "127.0.0.1:9083:9083"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9083' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [platform]

  spark-thrift:
    image: apache/spark:3.5.3
    user: root
    depends_on:
      hive-metastore:
        condition: service_healthy
    volumes:
      - warehouse:/opt/hive/data
      - ./spark-hive-site.xml:/opt/spark/conf/hive-site.xml:ro
    ports:
      - "127.0.0.1:10000:10000"
    command:
      - bash
      - -c
      - >
        exec /opt/spark/bin/spark-submit
        --class org.apache.spark.sql.hive.thriftserver.HiveThriftServer2
        --master "local[2]"
        --name spark-thrift
        --driver-memory 1g
        --conf spark.ui.enabled=false
        --conf spark.sql.catalogImplementation=hive
        --conf spark.sql.warehouse.dir=file:///opt/hive/data/warehouse
        --conf spark.sql.thriftServer.queryTimeout=120s
        --conf spark.sql.thriftServer.interruptOnCancel=true
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/10000' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks: [platform]

volumes:
  warehouse:

networks:
  platform:
    external: true
    name: ainative-backend
