[project]
name = "ainative-backend"
version = "0.1.0"
description = "AI-Native Data Platform - API and workers (M0/M1)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.5",
    "pymysql==1.2.0",
    "sqlglot==30.18.0",
    "argon2-cffi==25.1.0",
    "pyarrow==25.0.1",
    "typing-extensions==4.16.0",
    "pyyaml==6.0.3",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires the Docker core stack (control DB / source DB)",
    "contract: validates a locked third-party library or protocol contract",
    "security: attack-corpus and permission-boundary tests",
]
