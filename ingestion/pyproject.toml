[project]
name = "ainative-ingestion"
version = "0.1.0"
description = "AI-Native Data Platform ingestion runner (DataHub CLI). The runtime is the pinned official acryldata/datahub-ingestion image v1.7.0.1; this file records the SDK/plugin set for review. The image digest in docs/compatibility.md is the actual lock; the image reports SDK version 1.7.0.1+docker internally."
requires-python = ">=3.11,<3.12"
dependencies = [
    # Not installed by our build (the base image already provides the SDK and
    # the postgres/mysql/doris sources). This pin documents the PyPI release
    # line for anyone rebuilding the runner without the official image.
    "acryl-datahub[postgres,mysql,doris,hive-metastore]==1.7.0.10",
]

[tool.uv]
package = false
