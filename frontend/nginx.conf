server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend through Docker's embedded DNS on every re-resolution
    # window instead of once at startup: recreating the backend container (a
    # rebuild, a compose up) changes its IP, and a cached upstream address would
    # answer 502 until this container was restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://backend:8000";

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API and health proxied to the backend service on the compose network.
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: disable buffering, keep the connection open
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /health/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
